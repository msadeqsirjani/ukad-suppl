module: src.models.nets
class_name: NNUNetResEnc
config:
  in_ch: 3
  out_ch: 1
  # nnUNetPlannerResEncM 2-D plan for a 256x256 median shape (unit spacing):
  # patch 256x256 fits the 8 GB VRAM reference, min feature-map edge 4 gives
  # 6 poolings (7 stages), features 32*2^i capped at 512, ResEnc-M encoder
  # blocks (1,3,4,6,6,6,6), one conv per decoder stage, kernel 3 everywhere.
  filters: [32, 64, 128, 256, 512, 512, 512]
  strides: [1, 2, 2, 2, 2, 2, 2]
  blocks_per_stage: [1, 3, 4, 6, 6, 6, 6]
  decoder_blocks_per_stage: [1, 1, 1, 1, 1, 1]
  kernel_size: 3
